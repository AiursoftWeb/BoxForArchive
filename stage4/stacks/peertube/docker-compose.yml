version: '3.9'

services:
  peertube:
    image: pubhub.aiursoft.com/chocobozzz/peertube:production-bookworm
    volumes:
      - assets:/app/client/dist
      - data:/data
      - config:/config
    environment:
      POSTGRES_USER: peertube
      POSTGRES_PASSWORD: "{{PEERTUBE_POSTGRES_PASSWORD}}"
      POSTGRES_DB: peertube
      PEERTUBE_DB_USERNAME: peertube
      PEERTUBE_DB_PASSWORD: "{{PEERTUBE_POSTGRES_PASSWORD}}"
      PEERTUBE_DB_HOSTNAME: postgres
      PEERTUBE_DB_SSL: "false"
      PEERTUBE_WEBSERVER_HOSTNAME: videos.aiursoft.com
      PEERTUBE_SECRET: "{{PEERTUBE_SECRET}}"
      PEERTUBE_TRUST_PROXY: '["127.0.0.1","loopback","10.0.0.0/8"]'
      PEERTUBE_ADMIN_EMAIL: anduin@aiursoft.com
      PEERTUBE_SIGNUP_ENABLED: "false"
      PEERTUBE_TRANSCODING_ENABLED: "true"
      PEERTUBE_CONTACT_FORM_ENABLED: "true"
    networks:
      - proxy_app
      - internal
    stop_grace_period: 60s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
      update_config:
        order: stop-first
        delay: 60s

  postgres:
    image: pubhub.aiursoft.com/postgres:13-alpine
    environment:
      POSTGRES_USER: peertube
      POSTGRES_PASSWORD: "{{PEERTUBE_POSTGRES_PASSWORD}}"
      POSTGRES_DB: peertube
    volumes:
      - db:/var/lib/postgresql/data
    networks:
      - internal
    stop_grace_period: 60s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
      update_config:
        order: stop-first
        delay: 60s

  redis:
    image: pubhub.aiursoft.com/redis:6-alpine
    volumes:
      - redis:/data
    networks:
      - internal
    stop_grace_period: 60s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
      update_config:
        order: stop-first
        delay: 60s

networks:
  internal:
    driver: overlay
  proxy_app:
    external: true

volumes:
  assets:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/peertube/assets
  data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/peertube/data
  config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/peertube/config
  db:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/peertube/db
  redis:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/peertube/redis
